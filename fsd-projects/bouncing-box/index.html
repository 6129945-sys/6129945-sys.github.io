<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Bouncing Box</title>
  <script src="jquery.min.js"></script>
  <style>
    .box {
      width: 70px;
      height: 70px;
      background-color: #D3BC8D;
      border: 2px solid rgb(0, 0, 0);
      color: rgb(0, 0, 0);
      font-size: 300%;
      text-align: center;
      user-select: none;
      display: block;
      position: absolute;
      top: 100px;
      /* Change me! */
      left: 0px;
    }

    .board {
      height: 100vh;
      margin: 0;
      background-color: #ffffff;
    }

    .board::before {
      content: "Bouncing Box";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: black;
      font-family: "Remachine Script", cursive;
      font-size: 84px;
      text-align: center;
      white-space: nowrap;

    }
  </style>
  <!-- 	<script src="//cdnjs.cloudflare.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script> -->
</head>

<body class="board">
  <!-- HTML for the box -->
  <div class="box">?</div>

  <script>
    (function () {
      "use strict";
      /* global jQuery */

      //////////////////////////////////////////////////////////////////
      /////////////////// SETUP DO NOT DELETE //////////////////////////
      //////////////////////////////////////////////////////////////////

      var box = jQuery(".box"); // reference to the HTML .box element
      var board = jQuery(".board"); // reference to the HTML .board element
      var boardWidth = board.width(); // the maximum X-Coordinate of the screen
      var boardHeight = board.height();

      // update the boardWidth variable when the window is resized
      jQuery(window).on("resize", function () {
        boardWidth = board.width();
        boardHeight = board.height();
      });

      // Every 50 milliseconds, call the update Function (see below)
      setInterval(update, 50);

      // Every time the box is clicked, call the handleBoxClick Function (see below)
      box.on("click", handleBoxClick);

      // moves the Box to a new position on the screen
      function moveBoxTo(newPositionX, newPositionY) {
        box.css("left", newPositionX);
        box.css("top", newPositionY);
      }

      //////////////////////////////////////////////////////////////////
      /////////////////// YOUR CODE BELOW HERE /////////////////////////
      //////////////////////////////////////////////////////////////////

      // TODO 2 - Variable declarations
      var positionX = 0;
      var positionY = 100;
      var points = 0;
      var speed = 10;
      var directionX = 1;
      var directionY = 1;


      /**
       * This Function will be called 20 times/second.
       * Each time it is called, it should move the Box to a new location.
       * If the box drifts off the screen, turn it around!
       */
      function update() {
        var maxPositionX = boardWidth - box.outerWidth();
        var maxPositionY = boardHeight - box.outerHeight();

        positionX += speed * directionX;
        positionY += speed * directionY;

        if (positionX > maxPositionX) {
          positionX = maxPositionX;
          directionX = -1;
        } else if (positionX < 0) {
          positionX = 0;
          directionX = 1;
        }

        if (positionY > maxPositionY) {
          positionY = maxPositionY;
          directionY = -1;
        } else if (positionY < 0) {
          positionY = 0;
          directionY = 1;
        }

        moveBoxTo(positionX, positionY);
      }

      /**
       * This Function will be called each time the box is clicked.
       * Each time it is called, it should perform each of the following actions:
       * - increase the points total
       * - increase the speed
       */
      function handleBoxClick() {
        var maxPositionX = boardWidth - box.outerWidth();
        var maxPositionY = boardHeight - box.outerHeight();

        positionX = Math.random() * Math.max(0, maxPositionX);
        positionY = Math.random() * Math.max(0, maxPositionY);
        directionX = Math.random() < 0.5 ? -1 : 1;
        directionY = Math.random() < 0.5 ? -1 : 1;
        moveBoxTo(positionX, positionY);
        points = points + 1;
        box.text(points);
        speed = 3 * points + 10;





      }



    })();
  </script>
</body>

</html>
